## The 991 tests, run by something other than Paul remembering to.
##
## WHY A MATRIX AND NOT ONE JOB. This repository's most expensive rulings were
## measured on Windows and only on Windows -- that `openSync(path,'wx')` is the
## only exclusive filesystem primitive, that `unlinkSync` reported the wrong
## winner in 120 of 120 rounds, that `gblur` is nondeterministic on short frames.
## The queue is built on those findings. Deployment is not Windows. Running the
## same suite on both is the cheapest way to find out which of those rulings are
## about libuv-on-Windows and which are about the code, BEFORE a migration
## depends on the answer.
##
## Node 22 is the floor `package.json` declares; 24 is what the build machine
## runs. Both, because "engines: >=22" is a claim nobody has tested.
##
## NO SECRETS ARE AVAILABLE TO THIS WORKFLOW, deliberately. `npm test` is a bare
## `node --test` that does not load `.env`, and the only files permitted to spend
## money self-skip without TIMESTAMP_LIVE=1. A CI run that could spend money is a
## bill triggered by a pull request from a stranger.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; there is no value in finishing a run for
# a commit nobody is looking at any more.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false   # a Windows failure must not hide a Linux one
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No cache key and no `npm ci`: there are zero dependencies and no
          # lockfile. Nothing to install is the point, not an oversight.

      # ffmpeg is a hard dependency of 11 of the 40 test files -- the entire look
      # of this product is a filtergraph. Installed from each platform's own
      # package manager rather than a third-party action, because a marketplace
      # action is a supply-chain dependency and this repository has none.
      - name: install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # WHY THIS IS NOT ONE `choco install` LINE, since it used to be.
      # On 2026-08-31 community.chocolatey.org answered 504 for ~105 seconds.
      # choco reported "Chocolatey installed 0/0 packages" AND EXITED 0, so this
      # step went GREEN and the job died at the next one with "'ffmpeg' is not
      # recognized" -- which reads as a PATH bug and sends the diagnosis the
      # wrong way. Both Windows legs failed at the same second and nothing in
      # the commit was involved; it was a docs-only change.
      #
      # Three rulings came out of that, and each is one part of this step:
      #   1. CHOCO'S EXIT CODE IS NOT EVIDENCE. Probe for the binary instead.
      #   2. A 504 is usually a blip, so retry with backoff.
      #   3. When it is not a blip, fall back -- the outage above was still
      #      running hours later, so a retry alone would have stayed red.
      #
      # The fallback is gyan.dev because that is where the chocolatey package
      # gets its binaries: on the day this was written choco asked for 9.0.1 and
      # gyan.dev's own release-version file said 9.0.1, so this installs the
      # SAME build rather than a different one -- which matters, because §4 of
      # CLAUDE.md records two CI reds that were really one ffmpeg build's
      # wording. Measured on that build before trusting it: all 36 filters
      # `doctor` requires are present and it carries libfreetype, which is the
      # one `drawtext` needs and the omission the doctor's own header fears.
      # `Expand-Archive` ships inside PowerShell, so this adds no tool, no
      # marketplace action and no dependency.
      - name: install ffmpeg (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # The binary is the only thing that proves an install worked. The
          # chocolatey shim directory is on PATH on the runner already, but it
          # is checked by hand too so a stale process PATH cannot fake a miss.
          function Get-FfmpegPath {
            $cmd = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $shim = Join-Path $env:ProgramData 'chocolatey/bin/ffmpeg.exe'
            if (Test-Path $shim) { return $shim }
            return $null
          }

          foreach ($attempt in 1..3) {
            Write-Host "== choco install ffmpeg (attempt $attempt of 3)"
            choco install ffmpeg --no-progress -y
            if (Get-FfmpegPath) { Write-Host "ffmpeg present after attempt $attempt"; break }
            Write-Host "::warning::choco attempt $attempt installed no ffmpeg binary (exit code $LASTEXITCODE is not evidence)"
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }

          if (-not (Get-FfmpegPath)) {
            Write-Host "::warning::chocolatey did not deliver ffmpeg; falling back to the upstream build it packages"
            $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-fallback'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $zip = Join-Path $dest 'ffmpeg.zip'
            $got = $false
            foreach ($attempt in 1..3) {
              try {
                Invoke-WebRequest -UseBasicParsing -TimeoutSec 300 -OutFile $zip -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
                $got = $true
                break
              } catch {
                Write-Host "::warning::download attempt $attempt failed: $($_.Exception.Message)"
                if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
              }
            }
            if ($got) {
              Expand-Archive -Path $zip -DestinationPath $dest -Force
              $bin = Get-ChildItem -Path $dest -Recurse -Filter ffmpeg.exe |
                       Select-Object -First 1 -ExpandProperty DirectoryName
              if ($bin) {
                # PATH for THIS step, GITHUB_PATH for every step after it.
                $env:PATH = "$bin;$env:PATH"
                Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding utf8
                Write-Host "ffmpeg unpacked to $bin"
              }
            }
          }

          # This step fails HERE if ffmpeg is unusable -- not two steps later
          # wearing a PATH error's clothes.
          $found = Get-FfmpegPath
          if (-not $found) {
            Write-Host "::error::ffmpeg could not be installed from chocolatey or from gyan.dev. Both were tried three times. This is an install failure, not a PATH failure."
            exit 1
          }
          # Captured, THEN checked, THEN printed -- deliberately not piped into
          # `Select-Object -First 1`. Measured while writing this: piping the
          # version output into an early-stopping pipeline left $LASTEXITCODE at
          # -1 on a run where ffmpeg had plainly succeeded, which would fail the
          # build on the HAPPY path. Let the process finish, then read its code.
          $verOut = & $found -hide_banner -version
          $verCode = $LASTEXITCODE
          if ($verCode -ne 0) {
            Write-Host "::error::ffmpeg is present at $found but would not run (exit $verCode)"
            exit 1
          }
          Write-Host ($verOut | Select-Object -First 1)

      # Kept deliberately: the step above proves ffmpeg inside its own process,
      # this one proves it survived into a FRESH step, which is the only thing
      # that tests the GITHUB_PATH append the fallback depends on.
      - run: ffmpeg -version

      # The documented hard gate. It checks the filters the look actually uses,
      # the frame-count contract, and the bundled font -- so a green doctor on a
      # fresh runner is also proof the render is reproducible off this machine.
      - name: doctor
        run: npm run doctor

      # Redirected rather than piped. Piping `npm test` into anything reports the
      # PIPE's exit code, so a failing suite exits 0 and the summary still reads
      # the way you hoped -- a trap documented in CLAUDE.md that has already
      # caught somebody once.
      - name: test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "runner exit: $status"
          exit "$status"

      - name: summarise
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} · node ${{ matrix.node }}"
            echo '```'
            grep -E '^ℹ (tests|pass|fail|skipped|todo)' test-output.txt || echo 'no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-node${{ matrix.node }}
          path: test-output.txt
          retention-days: 7
